<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at top left,
    rgba(0,229,255,.08),
    transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(139,92,246,.08),
    transparent 35%),

    linear-gradient(
    180deg,
    #020205,
    #05070b,
    #060b12,
    #020205);

    color:white;
}

.register-box{
    width:400px;
    padding:35px;

    background:rgba(10,10,12,.8);

    border:1px solid rgba(0,229,255,.3);

    border-radius:20px;

    backdrop-filter:blur(10px);
}

.form-control{
    background:#111;
    color:white;
    border:1px solid #333;
}

.form-control:focus{
    background:#111;
    color:white;
    border-color:#00e5ff;
    box-shadow:none;
}

</style>    
</head>
<body>

<div class="register-box">

    <h2>Crear Cuenta</h2>
<label>Nombre</label>

<input
    type="text"
    id="register-name"
    class="form-control"
    placeholder="Tu nombre">

<label class="mt-3">Correo electrónico</label>
<input
    type="email"
    id="register-email"
    class="form-control"
    placeholder="ejemplo@gmail.com">

<label class="mt-3">Contraseña</label>
<input
    type="password"
    id="register-password"
    class="form-control"
    placeholder="••••••••">
    <button
    id="registerBtn"
    class="btn btn-success w-100">

        Registrarme

    </button>

    <a
    href="index.html"
    class="btn btn-outline-light w-100 mt-3">

        Volver

    </a>

</div>
<script type="module" src="firebase.js"></script>
</body>
</html>
