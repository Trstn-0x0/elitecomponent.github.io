<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Iniciar Sesión</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:
    radial-gradient(circle at top left,
    rgba(0,229,255,.08),
    transparent 35%),

    radial-gradient(circle at bottom right,
    rgba(139,92,246,.08),
    transparent 35%),

    linear-gradient(
    180deg,
    #020205,
    #05070b,
    #060b12,
    #020205);

    color:white;
}

.login-box{
    width:400px;
    padding:35px;

    background:rgba(10,10,12,.85);

    border:1px solid rgba(0,229,255,.3);

    border-radius:20px;

    backdrop-filter:blur(10px);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

label{
    color:#ccc;
    font-size:14px;
    margin-bottom:5px;
}

.form-control{
    background:#111;
    color:white;
    border:1px solid #333;
}

.form-control::placeholder{
    color:#777;
}

.form-control:focus{
    background:#111;
    color:white;
    border-color:#00e5ff;
    box-shadow:none;
}

</style>
</head>

<body>

<div class="login-box">

    <h2>Iniciar Sesión</h2>

    <label>Correo electrónico</label>
    <input
        type="email"
        id="login-email"
        class="form-control mb-3"
        placeholder="ejemplo@gmail.com">

    <label>Contraseña</label>
    <input
        type="password"
        id="login-password"
        class="form-control mb-3"
        placeholder="••••••••">

    <button
        id="loginBtn"
        class="btn btn-info w-100">

        Entrar

    </button>

    <a
        href="index.html"
        class="btn btn-outline-light w-100 mt-3">

        Volver

    </a>

</div>

<!-- FIREBASE -->
<script type="module" src="firebase.js"></script>

</body>
</html>
